[project]
name = "ai-job-agent"
version = "1.0.0"
description = "Advanced AI Job Application Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.19",
    "pgvector>=0.3.0",
    "celery>=5.4.0",
    "redis>=5.0.4",
    "playwright>=1.44.0",
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "openai>=1.30.0",
    "google-generativeai>=0.5.4",
    "pymupdf>=1.24.4",
    "python-docx>=1.1.2",
    "boto3>=1.34.0",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests", "deployment/scripts"]
